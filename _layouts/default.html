<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <title>{% if page.url == "/" %}尚小夏 · 大溪地的漏雨公寓。{% else %}{{ page.title | escape }} · {{ page.date_text }} · 尚小夏{% endif %}</title>
  <meta name="description" content="{% if page.url == "/" %}尚小夏写在博客大巴上的文章，从 Wayback Machine 找回，原文照录。{% else %}{{ page.title | escape }}。尚小夏，{{ page.date_text }}。{% endif %}">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:type" content="{% if page.url == "/" %}website{% else %}article{% endif %}">
  <meta property="og:title" content="{% if page.url == "/" %}尚小夏 · 大溪地的漏雨公寓。{% else %}{{ page.title | escape }}{% endif %}">
  <meta property="og:description" content="尚小夏的博客存档，自 Wayback Machine 找回。">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <div class="wrap">
    {% if page.url != "/" %}
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">尚小夏</a>
      </header>
    {% endif %}
    <main id="content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p><a href="{{ '/' | relative_url }}">尚小夏</a> · 自 Wayback Machine 找回的博客存档</p>
    </footer>
  </div>
</body>
</html>
